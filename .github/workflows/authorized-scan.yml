name: Authorized SentinelScan

on:
  workflow_dispatch:
    inputs:
      target:
        description: "HTTP(S) target included in SENTINEL_SCOPE_JSON"
        required: true
        type: string
      fail_on_severity:
        description: "Fail after the scan on actionable findings at or above this level"
        required: false
        default: high
        type: choice
        options: [info, low, medium, high]
      fail_on_baseline:
        description: "Fail on baseline changes when a baseline is supplied"
        required: false
        default: never
        type: choice
        options: [never, new, changed, regressed]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Scan authorized target
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: authorized-scan
    steps:
      - name: Check out trusted source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Write private scope file
        shell: bash
        env:
          SENTINEL_SCOPE_JSON: ${{ secrets.SENTINEL_SCOPE_JSON }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$SENTINEL_SCOPE_JSON"
          rm -f scope.local.json
          printf '%s' "$SENTINEL_SCOPE_JSON" > scope.local.json
      - name: Run bounded authorized scan
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          FAIL_ON_SEVERITY: ${{ inputs.fail_on_severity }}
          FAIL_ON_BASELINE: ${{ inputs.fail_on_baseline }}
        run: |
          set -euo pipefail
          mkdir -p reports
          set +e
          node src/cli.mjs \
            --target "$TARGET" \
            --scope scope.local.json \
            --confirm-authorized \
            --format json \
            --out reports/sentinelscan.json \
            --sarif-out reports/sentinelscan.sarif \
            --fail-on-severity "$FAIL_ON_SEVERITY" \
            --fail-on-baseline "$FAIL_ON_BASELINE" > /dev/null
          status=$?
          set -e
          printf '%s\n' "$status" > reports/sentinelscan.exit
          test "$status" -eq 0 -o "$status" -eq 2
      - name: Remove private scope file
        if: always()
        shell: bash
        run: rm -f scope.local.json
      - name: Upload findings to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/sentinelscan.sarif
          category: sentinelscan
      - name: Upload SentinelScan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinelscan-report
          path: reports/
      - name: Enforce scan policy
        if: always()
        shell: bash
        run: test "$(< reports/sentinelscan.exit)" -eq 0
