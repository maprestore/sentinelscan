name: Authorized SentinelScan

on:
  workflow_dispatch:
    inputs:
      target:
        description: "HTTPS origin included in SENTINEL_SCOPE_JSON"
        required: true
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Scan authorized target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET: ${{ inputs.target }}
      SENTINEL_SCOPE_JSON: ${{ secrets.SENTINEL_SCOPE_JSON }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Write private scope file
        shell: bash
        run: |
          test -n "$SENTINEL_SCOPE_JSON"
          printf '%s' "$SENTINEL_SCOPE_JSON" > scope.local.json
      - name: Run bounded authorized scan
        run: |
          mkdir -p reports
          node src/cli.mjs \
            --target "$TARGET" \
            --scope scope.local.json \
            --confirm-authorized \
            --format sarif \
            --out reports/sentinelscan.sarif
      - name: Upload findings to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/sentinelscan.sarif
          category: sentinelscan
