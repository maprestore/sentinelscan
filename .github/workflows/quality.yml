name: Quality

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run tests
        run: npm test
      - name: Check module syntax
        run: |
          for module in src/*.mjs; do node --check "$module"; done
      - name: Check public schemas
        run: node --test test/schema.test.mjs
      - name: Validate shipped configuration
        run: node src/cli.mjs validate config config.example.json --json
