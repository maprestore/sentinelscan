3%{opacity:1}98%,100%{opacity:0}}.l17{animation:l17 17.0s linear infinite}@keyframes l18{0%,39.41%{opacity:0}40.31%,93%{opacity:1}98%,100%{opacity:0}}.l18{animation:l18 17.0s linear infinite}@keyframes l19{0%,40.00%{opacity:0}40.90%,93%{opacity:1}98%,100%{opacity:0}}.l19{animation:l19 17.0s linear infinite}@keyframes l20{0%,43.53%{opacity:0}44.43%,93%{opacity:1}98%,100%{opacity:0}}.l20{animation:l20 17.0s linear infinite}
