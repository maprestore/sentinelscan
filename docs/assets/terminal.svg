<defs><linearGradient id="hd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16201f"/><stop offset="1" stop-color="#0f1817"/></linearGradient></defs>
<rect width="980" height="585" rx="14" fill="#070c0c"/>
<path d="M0 14a14 14 0 0 1 14-14h952a14 14 0 0 1 14 14v34H0z" fill="url(#hd)"/>
<circle cx="26" cy="24" r="6.5" fill="#ff5f57"/><circle cx="48" cy="24" r="6.5" fill="#febc2e"/><circle cx="70" cy="24" r="6.5" fill="#28c840"/>
<text x="490.0" y="29" text-anchor="middle" fill="#7d8a88" style="font-size:12.5px;letter-spacing:1.5px">sentinelscan  ·  bounded GET-only scan  ·  local fixture</text>
<line x1="0" y1="48.5" x2="980" y2="48.5" stroke="#1d2b2a"/>
<text class="l0" x="26" y="78" xml:space="preserve"><tspan fill="#b9ff4c" font-weight="700">$ </tspan><tspan fill="#e6edf3">node src/cli.mjs --target http://127.0.0.1:4599/ --scope scope.json --confirm-authorized</tspan></text><text class="l1" x="26" y="101" xml:space="preserve"><tspan fill="#44e6f2" font-weight="700">SentinelScan 0.5.0 | http://127.0.0.1:4599/</tspan></text><text class="l2" x="26" y="124" xml:space="preserve"><tspan fill="#7d8a88">Pages scanned: 2 | resources=1 | requests=12 | stop=queue-exhausted</tspan></text><text class="l3" x="26" y="147" xml:space="preserve"><tspan fill="#e6edf3">Findings: 19</tspan></text><text class="l4" x="26" y="170" xml:space="preserve"><tspan fill="#ffbd5a" font-weight="700">Risk: 100/100 (F) | attack paths=4</tspan></text><text class="l5" x="26" y="193" xml:space="preserve"><tspan fill="#7d8a88">Inventory: 1 forms, 2 scripts, 3 links, 2 client API endpoints</tspan></text><text class="l6" x="26" y="216" xml:space="preserve"><tspan fill="#7d8a88">Severity: low=10, medium=1, info=4, high=4</tspan></text><text class="l7" x="26" y="239" xml:space="preserve"><tspan fill="#e6edf3"></tspan></text><text class="l8" x="26" y="262" xml:space="preserve"><tspan fill="#ffbd5a" font-weight="700">[MEDIUM] </tspan><tspan fill="#e6edf3">Clickjacking protection is missing</tspan></text><text class="l9" x="26" y="285" xml:space="preserve"><tspan fill="#ff5b63" font-weight="700">[HIGH] </tspan><tspan fill="#e6edf3">Site is served over HTTP</tspan></text><text class="l10" x="26" y="308" xml:space="preserve"><tspan fill="#ff5b63" font-weight="700">[HIGH] </tspan><tspan fill="#e6edf3">Credential form submits over HTTP</tspan></text><text class="l11" x="26" y="331" xml:space="preserve"><tspan fill="#ff5b63" font-weight="700">[HIGH] </tspan><tspan fill="#e6edf3">Credential form uses GET</tspan></text><text class="l12" x="26" y="354" xml:space="preserve"><tspan fill="#44e6f2" font-weight="700">[LOW] </tspan><tspan fill="#e6edf3">External script has no integrity attribute</tspan></text><text class="l13" x="26" y="377" xml:space="preserve"><tspan fill="#ff5b63" font-weight="700">[HIGH] </tspan><tspan fill="#e6edf3">Git metadata is publicly readable</tspan></text><text class="l14" x="26" y="400" xml:space="preserve"><tspan fill="#7d8a88">  ... 13 more findings (output trimmed for this preview)</tspan></text><text class="l15" x="26" y="423" xml:space="preserve"><tspan fill="#e6edf3"></tspan></text><text class="l16" x="26" y="446" xml:space="preserve"><tspan fill="#ff4fd8" font-weight="700">[PATH HIGH] </tspan><tspan fill="#e6edf3">Credentials can travel through an unencrypted path</tspan></text><text class="l17" x="26" y="469" xml:space="preserve"><tspan fill="#7d8a88">  Why it matters: The site is served over HTTP and a password form submits over HTTP.</tspan></text><text class="l18" x="26" y="492" xml:space="preserve"><tspan fill="#ff4fd8" font-weight="700">[PATH MEDIUM] </tspan><tspan fill="#e6edf3">Browser supply-chain controls are weak</tspan></text><text class="l19" x="26" y="515" xml:space="preserve"><tspan fill="#e6edf3"></tspan></text><text class="l20" x="26" y="538" xml:space="preserve"><tspan fill="#b9ff4c">This is a safe observation report, not proof of exploitability.</tspan></text>
<rect class="cur" x="26" y="548" width="9" height="16" fill="#b9ff4c" opacity=".9"/>
<rect x="0.5" y="0.5" width="979" height="584" rx="14" fill="none" stroke="#44e6f2" stroke-opacity=".25"/>
