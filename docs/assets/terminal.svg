<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">SentinelScan local fixture output</title>
  <desc id="desc">A representative CLI output from the intentionally weak local fixture: 24 findings, risk 100 out of 100, and four correlated attack paths.</desc>
  <rect width="980" height="560" rx="14" fill="#081013"/>
  <rect x="1" y="1" width="978" height="558" rx="13" fill="none" stroke="#24414a"/>
  <circle cx="26" cy="24" r="6" fill="#ff5f57"/><circle cx="48" cy="24" r="6" fill="#febc2e"/><circle cx="70" cy="24" r="6" fill="#28c840"/>
  <path d="M0 48h980" stroke="#1d2b2a"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">
    <text x="26" y="84" fill="#b9ff4c">$ node src/cli.mjs --target http://127.0.0.1:4599/ --scope scope.json --confirm-authorized</text>
    <text x="26" y="116" fill="#44e6f2">SentinelScan 0.5.0 | http://127.0.0.1:4599/</text>
    <text x="26" y="148" fill="#7d8a88">Pages scanned: 2 | resources=1 | requests=12 | stop=queue-exhausted</text>
    <text x="26" y="180" fill="#e6edf3">Findings: 24</text>
    <text x="26" y="212" fill="#ffbd5a">Risk: 100/100 (F) | attack paths=4</text>
    <text x="26" y="244" fill="#7d8a88">Severity: low=14, medium=2, info=4, high=4</text>
    <text x="26" y="292" fill="#ffbd5a">[MEDIUM] Clickjacking protection is missing</text>
    <text x="26" y="324" fill="#ff5b63">[HIGH] Site is served over HTTP</text>
    <text x="26" y="356" fill="#ff5b63">[HIGH] Credential form submits over HTTP</text>
    <text x="26" y="388" fill="#ff5b63">[HIGH] Credential form uses GET</text>
    <text x="26" y="436" fill="#44e6f2">[LOW] External script has no integrity attribute</text>
    <text x="26" y="468" fill="#7d8a88">[INFO] Four correlated paths staged for review</text>
    <text x="26" y="520" fill="#b9ff4c">done / local fixture / GET only / evidence retained</text>
  </g>
</svg>
